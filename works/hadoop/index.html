<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Hadoop 生态圈｜数据工厂</title>
  <link rel="stylesheet" href="../../ui/site.css">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="../../covers/editor.css">
  <script type="module" src="./src/main.ts"></script>
  <script type="module" src="../../covers/editor.ts"></script>
</head>
<body>
  <header class="sitebar">
    <div class="sitebar-inner">
      <a class="brand" href="../../" aria-label="vibeV，返回作品目录">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>
        vibeV
      </a>
    </div>
  </header>
  <main class="viewer">
      <h1>Hadoop 生态圈</h1>
      <section class="player" id="player" aria-label="Hadoop 网页播放器" tabindex="0">
        <audio id="narration" data-src="./dub/narration.mp3" preload="none" hidden></audio>
        <div class="picture" id="picture">
          <canvas id="stage" width="1920" height="1080" aria-hidden="true"></canvas>
          <div class="frame-captions" aria-hidden="true"><p id="caption"></p></div>
          <noscript><p>开启 JavaScript 后即可播放。</p></noscript>
        </div>
        <div class="controls">
          <div id="seek-track" class="seek-track">
            <input id="seek" class="seek" type="range" min="0" max="435" step="any" value="0" aria-label="播放进度" disabled>
          </div>
          <div class="transport">
            <button id="play" class="play" type="button" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="icon-play" d="M7 4v16l14-8z" fill="currentColor"/><path class="icon-pause" d="M6 4h4v16H6zm8 0h4v16h-4z" fill="currentColor"/><path class="icon-replay" d="M4 10a8 8 0 1 1 1 7M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="play-label">播放</span>
            </button>
            <span class="clock"><span id="time">00:00</span><span class="divider">/</span><span id="duration">07:15</span></span>
            <button id="mute" class="mute" type="button" aria-pressed="false" hidden>静音</button>
            <span id="silent" class="silent" hidden>无声播放</span>
            <button id="expand" class="expand" type="button" aria-label="全屏" title="全屏" disabled>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5M4 15v5h5"/></svg>
            </button>
          </div>
          <p class="audio-status" id="audio-status" role="status" hidden></p>
        </div>
      </section>
      <nav class="editions" aria-label="播放版本">
        <a id="dubbed-edition" href="./" aria-current="page">配音版</a>
        <a id="full-edition" href="?version=full">无声版</a>
      </nav>

    <p id="transcript" class="transcript" aria-label="当前字幕"></p>
    <nav class="chapter-panel" aria-labelledby="chapter-heading">
      <h2 class="section-title" id="chapter-heading">章节</h2>
      <ol id="chapters" class="chapters"></ol>
    </nav>
    <form class="cover-editor" data-cover-editor="hadoop" aria-labelledby="cover-heading" hidden>
      <h2 class="section-title" id="cover-heading">作品封面</h2>
      <p id="cover-help">首页按 16:9 居中裁切。支持 PNG、JPEG、WebP，最大 5 MB。</p>
      <div class="cover-actions">
        <input type="file" aria-label="选择封面图片" aria-describedby="cover-help" accept="image/png,image/jpeg,image/webp" required>
        <button type="submit">上传封面</button>
        <button type="button" hidden>移除封面</button>
      </div>
      <p role="status"></p>
    </form>
  </main>
</body>
</html>
